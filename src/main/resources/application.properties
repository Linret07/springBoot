spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hw12}

# Keep this secret outside source control in a real deployment.
app.jwt.secret=${JWT_SECRET:hw12-development-secret-key-please-change}
app.jwt.access-lifetime-ms=${JWT_ACCESS_LIFETIME_MS:900000}
app.jwt.refresh-lifetime-ms=${JWT_REFRESH_LIFETIME_MS:604800000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.to=${MAIL_TO:owner@example.com}
app.mail.from=${MAIL_FROM:hw12@localhost}
